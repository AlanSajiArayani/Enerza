databases:
  - name: enerza-db
    databaseName: enerza
    user: enerza

services:
  - type: web
    name: enerza-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "cd backend && gunicorn enerza.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: enerza-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: enerza-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://enerza-frontend.onrender.com
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: enerza-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        value: "https://enerza-backend.onrender.com/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
